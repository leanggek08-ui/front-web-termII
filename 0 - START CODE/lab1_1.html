<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab1.1</title>
</head>
<body>
    <h1 id="main-title">Hello world</h1>
    <button id="change-btn">Chnage title</button>
    <script>
        const title = document.getElementById("main-title")
        const change = document.getElementById("change-btn")
        function change_title(){
            title.textContent = "Javascript is fun!"
        }
        change.addEventListener("click",change_title);
    </script>
</body>
</html>
